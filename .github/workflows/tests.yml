name: tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile sources
        run: python -m py_compile cmdgo_provider.py run.py login.py tests/test_mock.py tests/test_cached_auth.py
      - name: Run mock gateway test
        run: python tests/test_mock.py
      - name: Run cached auth test
        run: python tests/test_cached_auth.py
