name: release

# 推送 v* tag 时自动构建 Windows exe 并挂到 GitHub Release 上，
# 发版不再依赖开发机手工打包上传。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install pyinstaller customtkinter pystray pillow
      - name: Build General-cmdgo-provider.exe
        shell: cmd
        run: windows\build_gui.cmd
      - name: Smoke test the build
        shell: pwsh
        run: |
          # 启动打包产物，确认本地代理能起来再发布（坏包不进 Release）。
          Start-Process -FilePath dist\General-cmdgo-provider.exe
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try {
              $h = Invoke-RestMethod -Uri http://127.0.0.1:8787/healthz -TimeoutSec 2
              if ($h.ok) { $ok = $true; break }
            } catch { }
          }
          if (-not $ok) { Write-Error "General-cmdgo-provider.exe healthz did not come up within 30s" }
          Stop-Process -Name General-cmdgo-provider -Force -ErrorAction SilentlyContinue
      - name: Attach exe to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/General-cmdgo-provider.exe
