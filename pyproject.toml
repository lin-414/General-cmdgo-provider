[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmdgo-provider"
version = "0.4.2"
description = "Local OpenAI-compatible adapter for Command Code Go"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
gui = ["customtkinter>=5.2", "pystray>=0.19", "pillow>=9.0"]


[tool.pytest.ini_options]
testpaths = ["tests"]
